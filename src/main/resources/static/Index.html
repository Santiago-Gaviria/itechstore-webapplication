<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTechStore - Admin Dashboard</title>
    <!-- Fuente moderna 'Inter' -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2 class="brand-title">iTechStore</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active">📦 Inventory</div>
                <div class="nav-item">📈 Analytics</div>
                <div class="nav-item">⚙️ Settings</div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2 class="topbar-title">Inventory / Dashboard</h2>
            </header>

            <div class="content-grid">
                <!-- Form Card -->
                <div class="card form-card">
                    <h3>Add New Product</h3>
                    <form id="productForm" class="product-form">
                        <input type="text" id="productName" class="form-input" placeholder="Product Name" required>
                        <input type="number" id="price" class="form-input" placeholder="Price ($)" required>
                        <input type="number" id="stock" class="form-input" placeholder="Stock Quantity" required>
                        <input type="number" id="categoryId" class="form-input" placeholder="Category ID" required>
                        
                        <button type="submit" class="btn-neon">Save Product</button>
                    </form>
                    <div id="message" class="alert-message"></div>
                </div>

                <!-- Table Card -->
                <div class="card table-card">
                    <div class="table-header">
                        <h3>Products List</h3>
                    </div>
                    <table>
                        <thead>
                    
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Category</th>
                            </tr>
                            <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Category</th>
                                <th>Action</th> <!-- ✨ AGREGA ESTA LÍNEA -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- JavaScript llenará esto -->
                        </tbody>
                    </table>
                        </thead>
                        <tbody id="tableBody">
                            <!-- JavaScript llenará esto -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
